<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Bar System</title>
    <link rel="stylesheet" href="static/styling.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function(){
            // Handle form submission for placing orders
            $('form').on('submit', function(event){
                event.preventDefault(); // Prevent the form from submitting the default way
                var orderData = $(this).serialize(); // Serialize the form data
                $.ajax({
                    url: '/process_order',
                    type: 'POST',
                    data: orderData,
                    success: function(response){
                        $('#response').html(response.message); // Display the response message in the div
                    },
                    error: function(xhr, status, error){
                        console.error('Error:', error);
                        $('#response').html('An error occurred while processing the order.');
                    }
                });
            });

            // Handle voice transcription using Web Speech API
            var recognition;
            var isRecognizing = false;

            if ('webkitSpeechRecognition' in window) {
                recognition = new webkitSpeechRecognition();
                recognition.continuous = false;
                recognition.interimResults = false;

                recognition.onstart = function() {
                    isRecognizing = true;
                    $('input[name="order"]').attr('placeholder', 'Listening...');
                    $('input[name="order"]').removeClass('flashing'); // Stop flashing when listening starts
                };

                recognition.onresult = function(event) {
                    var transcript = event.results[0][0].transcript;
                    $('input[name="order"]').val(transcript);
                    $('input[name="order"]').attr('placeholder', 'e.g. Hello. Please can I order one large beer?');
                };

                recognition.onerror = function(event) {
                    console.error('Recognition error:', event);
                    $('input[name="order"]').attr('placeholder', 'Error occurred. Try again.');
                };

                recognition.onend = function() {
                    isRecognizing = false;
                    $('input[name="order"]').attr('placeholder', 'e.g. Hello. Please can I order one large beer?');
                    $('input[name="order"]').removeClass('flashing'); // Stop flashing when recognition ends
                };

                $('#transcribe-button').on('mousedown', function(){
                    if (recognition && !isRecognizing) {
                        $('input[name="order"]').val(''); // Clear the input box
                        $('input[name="order"]').attr('placeholder', 'Wait...');
                        $('input[name="order"]').addClass('flashing'); // Add flashing class
                        setTimeout(function(){
                            recognition.start();
                        }, 300); // Adding a delay before starting recognition
                    }
                });

                $('#transcribe-button').on('mouseup mouseleave', function(){
                    if (recognition && isRecognizing) {
                        recognition.stop();
                    }
                });
            } else {
                console.error('Web Speech API is not supported in this browser.');
                $('#transcribe-button').hide();
            }
        });
    </script>
</head>
<body>
    <form action="/process_order" method="post" class="form-style">
        <h1>Place your Order</h1>
        <div class="input-group">
            <input type="text" placeholder="e.g. Hello. Please can I order one large beer?" name="order" />
        </div>
        <button type="button" id="transcribe-button" class="button-style">Press and Hold to Speak</button>
        <input type="submit" value="Place Order">
        <div id="response"></div>
    </form>

    <h2>Drinks Menu</h2>
    <div id="drinks-menu">
        {% for drink in drinks_menu %}
            <div class="drink-item">
                <h3>{{ drink.name }}</h3>
                <ul>
                    {% for size in drink.sizes %}
                        <li>{{ size.size }} - £{{ size.price }}</li>
                    {% endfor %}
                </ul>
            </div>
        {% endfor %}
    </div>
</body>
</html>
